name: Scheduled task

on:
  schedule:
    - cron: '*/10 * * * *'   # every 10 minutes
    - cron: '0 6 * * 1'      # Mondays 06:00 UTC: keep-alive
  workflow_dispatch:
    inputs:
      mode:
        description: 'Run mode'
        type: choice
        options: [check, test, debug]
        default: check

permissions:
  contents: write

concurrency:
  group: scheduled-task
  cancel-in-progress: false

jobs:
  run:
    if: github.event.schedule != '0 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Restore state
        uses: actions/cache@v4
        with:
          path: state.json
          key: task-state-${{ github.run_id }}
          restore-keys: |
            task-state-

      - name: Run
        env:
          TARGET_URL: ${{ secrets.TARGET_URL }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RUN_MODE: ${{ github.event.inputs.mode || 'check' }}
        run: python check.py

  keepalive:
    if: github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: keep-alive
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "chore: keep-alive"
          git push
